# Server & Proxy Configuration
server.port=${PORT:8080}
server.forward-headers-strategy=framework

# Session Management (30 min idle timeout, httpOnly, Lax)
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.name=JSESSIONID

# Spring Data MongoDB
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/authease}
spring.data.mongodb.auto-index-creation=true

# AuthEase Application Settings
app.base-url=${APP_BASE_URL:http://localhost:8080}
authease.demo-mode=${AUTHEASE_DEMO_MODE:false}
authease.enc-key=${AUTHEASE_ENC_KEY:0123456789abcdef0123456789abcdef}
authease.ai-api-key=${AI_API_KEY:}

# Spring Mail (Optional - fallbacks to Outbox when not configured)
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# Static Resource Handling (Frontend served from same origin)
spring.web.resources.static-locations=classpath:/static/
